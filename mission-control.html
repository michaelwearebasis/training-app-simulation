<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basis Mission Control — training</title>
<style>
/* ---- Basis Mission Control (dark theme, stone palette) ---- */
:root{
  --bg:#0C0A09; --card:#1C1917; --card2:#292524; --card3:#44403C;
  --line:rgba(250,250,249,.09); --line2:rgba(250,250,249,.14);
  --fg:#FAFAF9; --d600:#D6D3D1; --d500:#A8A29E; --d400:#78716C; --d300:#57534E;
  --primary:#0EA5E9; --primary600:#0284C7; --success:#22C55E; --warning:#EAB308; --danger:#DE0F00;
  --homebg:#88EFB3; --homefg:#1E1E1F; --tradebg:#212629;
  --coach:#0EA5E9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:transparent}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px}
.app{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;align-items:center;gap:20px;height:56px;padding:0 20px;border-bottom:1px solid var(--line);background:#0C0A09;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#39E581,#0EA5E9);display:flex;align-items:center;justify-content:center;color:#0C0A09;font-weight:800;font-size:13px}
.brand .mc{color:var(--d500);font-weight:500}
.topnav{display:flex;gap:2px;margin-left:6px}
.topnav a{padding:7px 12px;border-radius:8px;color:var(--d500);font-weight:500;font-size:13px}
.topnav a.on{color:var(--fg);background:var(--card2)}
.topsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--d400);font-size:13px;min-width:220px}
.topuser{width:30px;height:30px;border-radius:50%;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--fg)}

/* layout */
.wrap{max-width:1200px;margin:0 auto;padding:24px 22px 80px;width:100%}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--d500);margin-bottom:16px}
.crumbs a{color:var(--d500)} .crumbs a:hover{color:var(--fg)}
.crumbs .sep{opacity:.5}

.h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--d500);font-size:13px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.card>.chd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card>.chd .t{font-size:15px;font-weight:600}
.card>.cbd{padding:16px 18px}
.card.pad0>.cbd{padding:0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:7px;padding:2px 8px;white-space:nowrap;line-height:1.4}
.chip.flat-default{background:var(--card3);color:var(--d600)}
.chip.flat-success{background:rgba(34,197,94,.16);color:#4ADE80}
.chip.flat-warning{background:rgba(234,179,8,.16);color:#FDE047}
.chip.flat-danger{background:rgba(222,15,0,.18);color:#FCA5A5}
.chip.flat-primary{background:rgba(14,165,233,.16);color:#7DD3FC}
.chip.solid-danger{background:var(--danger);color:#fff}
.chip.home{background:var(--homebg);color:var(--homefg);font-weight:600}
.chip.trade{background:var(--tradebg);color:#fff;border:1px solid var(--line2);font-weight:600}
.chip.sm{font-size:11px;padding:1px 7px}

.dotstat{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.dotstat i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dotstat.on i{background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.dotstat.off i{background:var(--danger)}

/* table (heroui-like) */
table.hu{width:100%;border-collapse:separate;border-spacing:0}
table.hu thead th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--d500);background:var(--card2);padding:10px 16px;white-space:nowrap}
table.hu thead th:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px}
table.hu thead th:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}
table.hu tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
table.hu tbody tr:last-child td{border-bottom:0}
table.hu tbody tr.click{cursor:pointer;transition:background .12s}
table.hu tbody tr.click:hover{background:var(--card2)}
table.hu tbody tr.dim{opacity:.5}
.thwrap{padding:4px}

.usercell{display:flex;align-items:center;gap:11px}
.usercell .av{width:34px;height:34px;border-radius:50%;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.usercell .nm{font-weight:500}
.usercell .de{font-size:12px;color:var(--d500)}

/* sub-nav tabs (underlined) */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:20px;overflow-x:auto}
.tabs button{position:relative;padding:11px 14px;color:var(--d500);font-weight:500;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}
.subtabs{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:18px}
.subtabs button{padding:6px 13px;border-radius:7px;color:var(--d500);font-weight:500;font-size:13px}
.subtabs button.on{background:var(--card3);color:var(--fg)}

/* site header */
.sitehead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.sitehead .addr{font-size:22px;font-weight:600;letter-spacing:-.02em}
.metarow{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--d500);font-size:13px;margin-top:8px}
.metarow b{color:var(--d600);font-weight:500}
.idbadge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--d500)}
.idbadge b{color:var(--fg);font-weight:500}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--d500);font-weight:600}
.kpi .v{font-size:22px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--d500);margin-top:2px}

/* grid helpers */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

/* flags icons */
.flagset{display:flex;align-items:center;gap:9px;color:var(--d400)}
.flagset svg{width:16px;height:16px;display:block}
.flagset .warn{color:var(--warning)}
.flagset .pri{color:var(--primary)}

/* connectivity */
.netgrid{display:grid;grid-template-columns:1fr auto auto;gap:6px 26px;align-items:center;font-size:13.5px}
.netgrid .hd{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--d400)}
.netgrid .row1{display:flex;align-items:center;gap:7px;color:var(--d600)}
.netgrid .row1 svg{width:17px;height:17px;flex:0 0 auto}
.signalpill svg{width:16px;height:16px}
.netgrid .val{text-align:right}
.expl{font-size:12px;color:var(--d500);margin-top:12px}
.signalpill{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--d500)}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px}
.bars i{width:3px;border-radius:1px;background:var(--d400)}
.bars i.on{background:var(--success)}

/* generic chart svg */
.chartwrap{position:relative}
svg.chart{display:block;width:100%}
.crosshair{stroke:var(--d400);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:#0C0A09;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);transform:translate(-50%,-115%);white-space:nowrap;z-index:5;opacity:0;transition:opacity .08s}
.tip .tt{color:var(--d500);font-size:11px;margin-bottom:2px}
.tip b{font-weight:600}

/* faults */
.faultbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rangechip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;font-size:13px;color:var(--fg)}
.sevlegend{display:flex;gap:14px;margin-left:auto;font-size:12px;color:var(--d500)}
.sevlegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.daygroup{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--d400);padding:12px 12px 6px}
.fault{border-bottom:1px solid var(--line)}
.fault .frow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 9px;border-left:3px solid transparent;cursor:pointer;transition:background .12s}
.fault .frow:hover{background:var(--card2)}
.fault.critical .frow{border-left-color:#DE0F00}
.fault.error .frow{border-left-color:#F97316}
.fault.warning .frow{border-left-color:#EAB308}
.fault .ftime{width:82px;flex:0 0 auto;font-size:12px;color:var(--d600)}
.sevchip{display:inline-flex;align-items:center;gap:5px;width:78px;justify-content:center;height:20px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;flex:0 0 auto}
.sevchip i{width:6px;height:6px;border-radius:50%}
.sevchip.critical{background:rgba(222,15,0,.16);color:#FCA5A5} .sevchip.critical i{background:#DE0F00}
.sevchip.error{background:rgba(249,115,22,.16);color:#FDBA74} .sevchip.error i{background:#F97316}
.sevchip.warning{background:rgba(234,179,8,.16);color:#FDE047} .sevchip.warning i{background:#EAB308}
.fsource{width:150px;flex:0 0 auto;font-size:13.5px;font-weight:500;color:var(--fg)}
.fmid{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.scpill{display:inline-flex;align-items:center;gap:6px;background:var(--card3);border-radius:6px;padding:2px 8px;font-size:12px}
.scpill b{font-size:11px;background:var(--card);border-radius:4px;padding:0 5px}
.fwave{flex:0 0 auto}
.fwave .wbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card3);border:1px solid var(--line2);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--fg)}
.fwave .wbtn:hover{background:var(--card2)}
.fchev{width:16px;height:16px;color:var(--d400);transition:transform .18s;flex:0 0 auto}
.fault.open .fchev{transform:rotate(180deg)}
.fexpand{background:rgba(41,37,36,.5);border-left:3px solid transparent;padding:14px 16px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 22px}
.dl .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--d400)}
.dl .v{font-size:13.5px;margin-top:2px}

/* waveform modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(4,6,10,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.modal .sheet{background:var(--card);border:1px solid var(--line2);border-radius:14px;width:min(920px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .mhd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.modal .mhd .t{font-size:16px;font-weight:600}
.modal .mhd .x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--d500)}
.modal .mhd .x:hover{background:var(--card2);color:var(--fg)}
.modal .mbd{padding:14px 18px 20px;display:flex;flex-direction:column;gap:10px}
.wchart{border:1px solid var(--line);border-radius:9px;background:rgba(41,37,36,.35);padding:10px 12px}
.wchart .whd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
.wchart .wlab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.wchart .wsw{width:9px;height:9px;border-radius:2px}
.wchart .wread{text-align:right;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;line-height:1.3}
.wchart .wread .rms{color:var(--d500)} .wchart .wread .cur{color:var(--d600)}
.wchart svg{display:block;width:100%;height:150px;cursor:crosshair}

/* savings */
.rlogo{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}
.slabel{font-size:15px;font-weight:600;color:var(--d600);margin-bottom:8px}
.planbar{display:grid;grid-template-columns:220px 1fr 128px;align-items:center;gap:14px}
.planbar.cur{background:rgba(14,165,233,.07);border:1px solid rgba(14,165,233,.28);border-radius:9px;padding:8px 10px;margin:-4px -2px}
.planbar .pl{display:flex;align-items:center;gap:10px;min-width:0}
.planbar .pn{font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.planbar .ps{font-size:12px;color:var(--d500);margin-top:1px}
.planbar .track{height:12px;background:var(--card3);border-radius:6px;overflow:hidden}
.planbar .fill{height:100%;background:var(--d400);border-radius:6px}
.planbar .fill.best{background:var(--success)}
.planbar .fill.curfill{background:var(--primary)}
.planbar .amt{text-align:right;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:flex-end;gap:7px}
.planbar .amt .mo{font-size:11px;color:var(--d500);font-weight:400}
@media(max-width:720px){.planbar{grid-template-columns:1fr auto}.planbar .track{grid-column:1/-1;order:3}}

/* coach */
.coach{position:fixed;z-index:60;left:50%;bottom:26px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:#0C0A09;border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.coach .num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#39E581,#0EA5E9);color:#0C0A09;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.coach .body{flex:1;min-width:0}
.coach .step{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--d500);font-weight:600}
.coach .msg{margin-top:3px;font-size:14px;color:var(--fg)}
.coach .msg b{color:#7DD3FC;font-weight:600}
.coach .actions{display:flex;align-items:center;gap:10px;margin-top:12px}
.coach .btn{background:var(--primary);color:#fff;border-radius:9px;padding:8px 16px;font-weight:600;font-size:13px}
.coach .btn:hover{background:var(--primary600)}
.coach .btn.ghost{background:transparent;color:var(--d500);padding:8px 6px}
.coach .prog{margin-left:auto;font-size:12px;color:var(--d400)}
.coach.hint .msg b{color:#FDE047}
/* spotlight */
.spot{position:absolute;border-radius:12px;box-shadow:0 0 0 3px rgba(14,165,233,.9),0 0 0 9999px rgba(4,6,10,.55);pointer-events:none;z-index:20;transition:all .25s ease;animation:coachpulse 1.8s ease-in-out infinite}
@keyframes coachpulse{0%,100%{box-shadow:0 0 0 3px rgba(14,165,233,.95),0 0 0 9999px rgba(4,6,10,.55)}50%{box-shadow:0 0 0 6px rgba(14,165,233,.5),0 0 0 9999px rgba(4,6,10,.55)}}
.locked{position:relative}
.locked::after{content:"";position:absolute;inset:0;z-index:15}
.pointing{position:relative;z-index:22}
</style></head>

/* Waveform synthesis — realistic AFDD/RCD capture. Cached per fault id. */
const _waveCache={};
function genWave(id){
  if(_waveCache[id]) return _waveCache[id];
  const N=500, windowMs=200, t=i=>i/(N-1)*windowMs;
  const arr=fn=>{const a=new Array(N);for(let i=0;i<N;i++)a[i]=fn(t(i),i);return a;};
  const V=arr(ms=>230*Math.SQRT2*Math.sin(2*Math.PI*50*ms/1000));
  let ch;
  if(id==="f2"){ // RCD trip — residual current rises then trips
    const I=arr(ms=>{const base=6*Math.SQRT2*Math.sin(2*Math.PI*50*ms/1000);const leak=ms>70?Math.min(1,(ms-70)/40)*0.02*Math.sin(2*Math.PI*50*ms/1000+0.6):0;return base+base*leak*30;});
    const RES=arr((ms)=>{const g=ms>70?Math.min(12,(ms-70)/50*12):0.4; return g*Math.abs(Math.sin(2*Math.PI*50*ms/1000))+ (Math.random()-0.5)*0.4;});
    ch=[cV(V),cI(I,"Current"),{key:"res",label:"Residual current",unit:"mA",color:"#F59E0B",samples:RES,range:null},cModel(arr(ms=>ms>70?Math.min(1.4,(ms-70)/60):0.15+ Math.random()*0.03))];
  } else { // AFDD trip / informative — arcing current + Rogowski HF + model state
    const trip = id==="f1";
    const I=arr((ms)=>{let s=9*Math.SQRT2*Math.sin(2*Math.PI*50*ms/1000);
      if(ms>60){const arcs=(Math.random()<0.35?1:0)*(Math.random()*6-3)*(ms>100?1.6:1);const flat=Math.sign(s)*Math.min(Math.abs(s),9);s=flat+arcs;}return s;});
    const CROG=arr((ms)=>{const burst=ms>60?(Math.random()<0.5?Math.random()* (ms>100?22:12):Math.random()*4):Math.random()*2;return Math.min(25,burst);});
    const MOD=arr((ms)=>{const base= ms<60?0.1+Math.random()*0.05 : Math.min(trip?1.35:0.92,(ms-60)/(trip?70:110))+Math.random()*0.04; return Math.max(0,base);});
    ch=[cV(V),cI(I,"Current"),{key:"crog",label:"AFDD Rogowski",unit:null,range:{min:0,max:25},color:"#22D3EE",samples:CROG},cModel(MOD)];
  }
  const res={windowMs,N,channels:ch.map(c=>({...c,rms:rmsOf(c)}))};
  _waveCache[id]=res; return res;
}
function cV(V){return {key:"v",label:"Voltage",unit:"V",color:"#7DD3FC",samples:V,range:null};}
function cI(I,label){return {key:"i",label:label,unit:"A",color:"#FDE047",samples:I,range:null};}
function cModel(M){return {key:"model",label:"AFDD model state",unit:null,range:{min:0,max:1.5},color:"#F472B6",samples:M,trip:1.0};}
function rmsOf(c){ if(c.key==="crog"||c.key==="model") return null; const w=Math.round(c.samples.length*0.2); let s=0,n=0; for(let i=0;i<w;i++){s+=c.samples[i]*c.samples[i];n++;} const r=Math.sqrt(s/n); return c.unit==="V"?r.toFixed(1)+" V":c.unit==="A"?r.toFixed(2)+" A":c.unit==="mA"?r.toFixed(1)+" mA":r.toFixed(2); }

/* interactive signal chart (dBm) with quality bands */
function signalChart(){
  // synth 1h series around -59, hover-interactive
  const W=880,H=230, pad={l:44,r:14,t:12,b:26};

  let v=-59; for(let i=0;i<N;i++){ v += (Math.sin(i/6)*0.9 + (((i*37)%7)-3)*0.6); v=Math.max(-64,Math.min(-54,v)); pts.push(v); }
  const ymin=-80,ymax=-40;
  const x=i=> pad.l + i/(N-1)*(W-pad.l-pad.r);
  const y=val=> pad.t + (ymax-val)/(ymax-ymin)*(H-pad.t-pad.b);
  const bands=[["Poor",-80,-70,"rgba(243,18,96,.10)","#F87088"],["Fair",-70,-60,"rgba(245,165,36,.10)","#F5A524"],["Good",-60,-50,"rgba(6,182,212,.10)","#22D3EE"],["Excellent",-50,-40,"rgba(23,201,100,.10)","#4ADE80"]];

function niceScale(lo,hi){ if(lo===hi){lo-=1;hi+=1;} const span=hi-lo; let step=Math.pow(10,Math.floor(Math.log10(span/4))); const err=span/4/step; const mult=err>=7.5?10:err>=3?5:err>=1.5?2:1; const s=step*mult; const nlo=Math.floor(lo/s)*s, nhi=Math.ceil(hi/s)*s; const ticks=[]; for(let v=nlo;v<=nhi+1e-9;v+=s)ticks.push(+v.toFixed(6)); return {lo:nlo,hi:nhi,ticks}; }
function fmtTick(c,v){ if(c.unit==="V")return Math.round(v); if(c.unit==="A")return v.toFixed(0); if(c.unit==="mA")return v.toFixed(0); if(c.key==="model")return v.toFixed(1); if(c.key==="crog")return v.toFixed(0); return v.toFixed(1);}
function fmtVal(c,v){ if(c.unit==="V")return v.toFixed(1)+" V"; if(c.unit==="A")return v.toFixed(2)+" A"; if(c.unit==="mA")return v.toFixed(1)+" mA"; if(c.key==="model")return v.toFixed(2); if(c.key==="crog")return v.toFixed(1); return v.toFixed(2);}

}
function waveChart(c,idx,w,reserve){
  const W=1180,H=160,padL=58,padR=reserve?52:12,padT=10,padB=24;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  let sc; if(c.range) sc=niceScale(c.range.min,c.range.max);
  else{let mn=Infinity,mx=-Infinity;c.samples.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v;});sc=niceScale(mn,mx);}
  const yr=sc.hi-sc.lo;
  const X=i=>padL+i/(c.samples.length-1)*innerW;
  const Y=v=>padT+(1-(v-sc.lo)/yr)*innerH;
  const path=c.samples.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  const grid=sc.ticks.map(v=>`<line x1="${padL}" x2="${W-padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(250,250,249,.13)"/><text x="${padL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--d400)">${fmtTick(c,v)}</text>`).join("");
  const trip=c.trip!=null?`<line x1="${padL}" x2="${W-padR}" y1="${Y(c.trip).toFixed(1)}" y2="${Y(c.trip).toFixed(1)}" stroke="#DE0F00" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-padR-4}" y="${(Y(c.trip)-4).toFixed(1)}" text-anchor="end" font-size="10" fill="#FCA5A5">trip 1.0</text>`:'';
  const rTicks=c.trip!=null?sc.ticks.map(v=>`<text x="${W-padR+6}" y="${(Y(v)+3).toFixed(1)}" font-size="11" fill="var(--d400)">${v.toFixed(1)}</text>`).join(""):'';
  const axisTitle=c.unit?`${c.label} (${c.unit})`:c.key==='crog'?`${c.label} (0–25)`:c.label;
  return `<div class="wchart" data-ch="${idx}" data-padl="${padL}" data-innerw="${innerW}" data-w="${W}" data-window="${w.windowMs}" data-n="${c.samples.length}">
    <div class="whd">
      <div class="wlab"><span class="wsw" style="background:${c.color}"></span>${c.label}</div>
      <div class="wread">${c.rms?`<div class="rms">RMS (first 40 ms): ${c.rms}</div>`:'<div class="rms">&nbsp;</div>'}<div class="cur" data-read>&nbsp;</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${grid}${trip}${rTicks}
      <line x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT+innerH}" stroke="rgba(250,250,249,.13)"/>
      <line x1="${W-padR}" x2="${W-padR}" y1="${padT}" y2="${padT+innerH}" stroke="rgba(250,250,249,.13)"/>
      <path d="${path}" fill="none" stroke="${c.color}" stroke-width="1.4"/>
      <line class="wcursor" x1="0" x2="0" y1="${padT}" y2="${padT+innerH}" stroke="var(--fg)" stroke-opacity=".5" style="opacity:0"/>
      <text transform="rotate(-90 12 ${H/2})" x="12" y="${H/2}" text-anchor="middle" font-size="12" font-weight="600" fill="${c.color}">${axisTitle}</text>
      <text x="${padL}" y="${H-6}" font-size="10" fill="var(--d400)">0 ms</text>
      <text x="${W-padR}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--d400)">${w.windowMs} ms</text>
    </svg>
  </div>`;
}

/* ---------- Insights ---------- */
let _ins=null;
function genInsights(){
  if(_ins) return _ins;
  const H=48, hr=i=>i/2, rnd=(a,b)=>a+Math.random()*(b-a);
  const peak=[],volt=[],freq=[],temp=[];
  for(let i=0;i<H;i++){ const h=hr(i);
    let p; if(h>=5&&h<8.5) p=2.2+2.4*Math.sin((h-5)/3.5*Math.PI)+rnd(0,.4);
      else if(h>=17&&h<20) p=3.5+4.5*Math.sin((h-17)/3*Math.PI)+rnd(0,.5);
      else if(h>=9&&h<17) p=0.9+rnd(0,.9); else p=0.32+rnd(0,.22);
    peak.push({t:h,v:+p.toFixed(2)});
    volt.push({t:h,v:+(235+6*Math.sin(i/5)+rnd(-3,3)).toFixed(1)});
    freq.push({t:h,v:+(50+rnd(-0.12,0.12)).toFixed(2)});
    temp.push({t:h,v:+(38+4*Math.sin((h-15)/6)+rnd(-1,1)).toFixed(1)});
  }
  peak[38]={t:19,v:13.35}; peak[37]={t:18.5,v:9.4}; peak[39]={t:19.5,v:8.1};
  volt[25]={t:12.5,v:253.5}; freq[13]={t:6.5,v:48.14};
  temp[36]={t:18,v:71.8}; temp[35]={t:17.5,v:52}; temp[37]={t:18.5,v:49};
  _ins={peak,volt,freq,temp,peakI:38,voltI:25,freqI:13,tempI:36};
  return _ins;
}
const INS_CFG={peakchart:{key:"peak",fmt:v=>v.toFixed(2)+" kW"},voltchart:{key:"volt",fmt:v=>v.toFixed(1)+" V"},freqchart:{key:"freq",fmt:v=>v.toFixed(2)+" Hz"},tempchart:{key:"temp",fmt:v=>v.toFixed(1)+" °C"}};
function bandChart(o){
  const W=900,padL=46,padR=14,padT=12,padB=26,H=o.height||230;
  const iW=W-padL-padR,iH=H-padT-padB, s=o.series;
  const X=i=>padL+i/(s.length-1)*iW, Y=v=>padT+(o.ymax-v)/(o.ymax-o.ymin)*iH;
  const bands=(o.bands||[]).map(b=>`<rect x="${padL}" y="${Y(b.to).toFixed(1)}" width="${iW}" height="${(Y(b.from)-Y(b.to)).toFixed(1)}" fill="${b.fill}"/>${b.label?`<text x="${W-padR-6}" y="${(Y(b.to)+13).toFixed(1)}" text-anchor="end" font-size="10" fill="${b.lc||'var(--d400)'}">${b.label}</text>`:''}`).join("");
  const nt=o.yticks||5; let yt=""; for(let k=0;k<=nt;k++){const v=o.ymin+(o.ymax-o.ymin)*k/nt; yt+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(250,250,249,.06)"/><text x="${padL-7}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--d400)">${(o.yfmt||(x=>Math.round(x)))(v)}</text>`;}
  const nom=o.nominal?`<line x1="${padL}" x2="${W-padR}" y1="${Y(o.nominal.v).toFixed(1)}" y2="${Y(o.nominal.v).toFixed(1)}" stroke="var(--d400)" stroke-dasharray="5 4"/><text x="${W-padR-4}" y="${(Y(o.nominal.v)-4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--d500)">${o.nominal.label}</text>`:'';
  const line=s.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
  const area=o.area?`<path d="${line} L${X(s.length-1).toFixed(1)} ${Y(o.ymin).toFixed(1)} L${padL} ${Y(o.ymin).toFixed(1)} Z" fill="${o.color}" opacity=".13"/>`:'';
  const mk=o.marker!=null?`<circle cx="${X(o.marker.i).toFixed(1)}" cy="${Y(s[o.marker.i].v).toFixed(1)}" r="4" fill="${o.marker.color||o.color}"/><text x="${X(o.marker.i).toFixed(1)}" y="${(Y(s[o.marker.i].v)-9).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="${o.marker.color||o.color}">${o.marker.label}</text>`:'';
  const dots=o.id?s.map((p,i)=>`<circle class="pt" data-i="${i}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="6" fill="transparent"/>`).join(""):'';
  const xl=["00:00","06:00","12:00","18:00","24:00"].map((l,k)=>`<text x="${(padL+k/4*iW).toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':k===4?'end':'middle'}" font-size="10" fill="var(--d400)">${l}</text>`).join("");
  return `<div class="chartwrap" ${o.id?`id="${o.id}"`:''}>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
      ${bands}${yt}${nom}${area}
      <path d="${line}" fill="none" stroke="${o.color}" stroke-width="1.6"/>${mk}${xl}
      <line class="crosshair ch" x1="0" y1="${padT}" x2="0" y2="${H-padB}" style="opacity:0"/>
      <circle class="mk" r="3.5" fill="${o.color}" style="opacity:0"/>${dots}
    </svg>${o.id?'<div class="tip" data-tip></div>':''}</div>`;
}
function insightsTab(){
  const sub=[["peak","Peak load"],["pq","Power quality"],["temp","Temperature"]].map(([k,l])=>`<button id="itab-${k}" class="${S.insTab===k?'on':''}" data-itab="${k}">${l}</button>`).join("");
  const body=S.insTab==="peak"?peakLoadView():S.insTab==="pq"?powerQualityView():temperatureView();
  return `<div class="subtabs">${sub}</div>${body}`;
}
function peakLoadView(){
  const d=genInsights();
  return `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
     <div class="kpi"><div class="k">Peak demand</div><div class="v">13.3 kW</div><div class="s">whole house · evening</div></div>
     <div class="kpi"><div class="k">99.9th percentile</div><div class="v">6.0 kW</div><div class="s">rarely above this</div></div>
     <div class="kpi"><div class="k">Supply</div><div class="v">63 A</div><div class="s">≈ 14.5 kW single‑phase</div></div>
   </div>
   <div class="card"><div class="chd"><span class="t">Whole‑house demand</span><span class="sub" style="font-size:12px">Typical day · hover to read</span></div>
     <div class="cbd">${bandChart({id:"peakchart",series:d.peak,ymin:0,ymax:14,color:"#4ADE80",area:true,height:250,marker:{i:d.peakI,label:"13.3 kW",color:"#4ADE80"},yfmt:v=>v.toFixed(0)})}
     <p class="sub" style="font-size:12.5px;margin-top:8px">The biggest simultaneous demand this house has drawn is <b style="color:var(--fg)">13.3 kW</b> — evening cooking (oven + hob) overlapping with hot‑water heating — comfortably under the 63 A (~14.5 kW) supply.</p></div></div>`;
}
function powerQualityView(){
  const d=genInsights();
  const vbands=[{from:253,to:260,fill:"rgba(222,15,0,.14)",label:"High",lc:"#FCA5A5"},{from:216,to:253,fill:"rgba(34,197,94,.10)",label:"In range",lc:"#4ADE80"},{from:200,to:216,fill:"rgba(222,15,0,.14)",label:"Low",lc:"#FCA5A5"}];
  const fbands=[{from:50.5,to:52.5,fill:"rgba(222,15,0,.14)"},{from:49.5,to:50.5,fill:"rgba(34,197,94,.10)",label:"In range",lc:"#4ADE80"},{from:47.5,to:49.5,fill:"rgba(222,15,0,.14)"}];
  return `<div class="card" style="margin-bottom:16px"><div class="chd"><span class="t">Voltage · panel</span><span class="sub" style="font-size:12px">Last 90 days</span></div>
     <div class="cbd">${bandChart({id:"voltchart",series:d.volt,ymin:200,ymax:260,color:"#FAFAF9",bands:vbands,nominal:{v:230,label:"Nominal · 230"},height:230,marker:{i:d.voltI,label:"253.5 V",color:"#FCA5A5"},yfmt:v=>v.toFixed(0)})}
     <p class="sub" style="font-size:12.5px;margin-top:6px">Sits around <b style="color:var(--fg)">236 V</b>, but has touched <b style="color:#FCA5A5">253.5 V</b> — just over the 253 V (230 V +10%) limit. Worth watching if the customer reports flickering or gear tripping.</p></div></div>
   <div class="card"><div class="chd"><span class="t">Frequency · panel</span><span class="sub" style="font-size:12px">Last 90 days</span></div>
     <div class="cbd">${bandChart({id:"freqchart",series:d.freq,ymin:47.5,ymax:52.5,color:"#FAFAF9",bands:fbands,nominal:{v:50,label:"Nominal · 50"},height:220,yticks:5,marker:{i:d.freqI,label:"48.1 Hz",color:"#FCA5A5"},yfmt:v=>v.toFixed(1)})}
     <p class="sub" style="font-size:12.5px;margin-top:6px">Normally rock‑steady at 50 Hz; one grid dip to <b style="color:#FCA5A5">48.1 Hz</b>. A wandering grid can be the real source of a “panel problem”.</p></div></div>`;
}
function temperatureView(){
  const d=genInsights();
  const tbands=[{from:65,to:80,fill:"rgba(222,15,0,.14)",label:"Over‑range",lc:"#FCA5A5"},{from:30,to:65,fill:"rgba(34,197,94,.08)",label:"Normal",lc:"#4ADE80"}];
  return `<div class="card"><div class="chd"><span class="t">Circuit module temperature</span><span class="sub" style="font-size:12px">Hottest module · last 90 days</span></div>
     <div class="cbd">${bandChart({id:"tempchart",series:d.temp,ymin:30,ymax:80,color:"#FBBF24",bands:tbands,nominal:{v:65,label:"Alert · 65 °C"},height:250,marker:{i:d.tempI,label:"71.8 °C event",color:"#FCA5A5"},yfmt:v=>v.toFixed(0)})}
     <p class="sub" style="font-size:12.5px;margin-top:6px">Modules normally run ~40 °C. On 18 Jul one module spiked to <b style="color:#FCA5A5">71.8 °C</b> — over the 65 °C alert line — during that evening’s heavy load. A one‑off, but a repeat would point to a loose termination worth re‑checking.</p></div></div>`;
}

/* ---------- Savings · retail comparison ---------- */
function sCard(label,row,cur){
  const save=cur.monthly-row.monthly, pct=Math.round(save/cur.monthly*100);
  const badge = row.current ? '<span class="chip flat-default">Current plan</span>'
    : save>0 ? `<span class="chip flat-success">Save $${save}/mo · ${pct}%</span>`
    : `<span class="chip flat-danger">$${-save}/mo more</span>`;
  return `<div><div class="slabel">${label}</div>
    <div class="card"><div class="cbd">
      <div style="display:flex;align-items:center;gap:11px"><span class="rlogo" style="background:${logoColor(row.retailer)}">${initials(row.retailer)}</span>
        <div><div style="font-weight:600">${row.retailer}</div><div class="sub" style="font-size:12.5px">${row.plan}${row.free1h?' · 1h free':''}</div></div></div>
      <div style="font-size:27px;font-weight:600;margin-top:12px;letter-spacing:-.01em">$${row.monthly}<span style="font-size:14px;color:var(--d500);font-weight:400"> /mo</span></div>
      <div style="margin-top:7px">${badge}</div>
    </div></div></div>`;
}
function savingsTab(){
  const sorted=[...SAVINGS.plans].sort((a,b)=>a.monthly-b.monthly);
  const cur=SAVINGS.plans.find(p=>p.current), best=sorted[0], worst=sorted[sorted.length-1], max=worst.monthly;
  const bars=sorted.map(p=>{
    const isBest=p===best, w=(p.monthly/max*100).toFixed(1), save=cur.monthly-p.monthly;
    return `<div class="planbar ${p.current?'cur':''}">
      <div class="pl"><span class="rlogo" style="background:${logoColor(p.retailer)}">${initials(p.retailer)}</span>
        <div><div class="pn">${p.retailer} · ${p.plan}${p.free1h?' <span class="chip flat-success sm">1h free</span>':''}</div>
          <div class="ps">${p.current?'On this plan now':save>0?`$${save}/mo cheaper`:`$${-save}/mo dearer`}</div></div></div>
      <div class="track"><div class="fill ${isBest?'best':p.current?'curfill':''}" style="width:${w}%"></div></div>
      <div class="amt">${isBest?'<span class="chip flat-success sm">Best</span>':''}<span>$${p.monthly}<span class="mo"> /mo</span></span></div>
    </div>`;
  }).join("");
  const bestSave=cur.monthly-best.monthly, bestPct=Math.round(bestSave/cur.monthly*100);
  return `<div style="display:flex;align-items:center;gap:10px;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.28);border-radius:11px;padding:12px 15px;margin-bottom:16px">
      <span class="chip flat-success">Save up to $${bestSave}/mo</span>
      <span style="font-size:13px;color:var(--d600)">Switching from <b style="color:var(--fg)">${cur.retailer} ${cur.plan}</b> to <b style="color:var(--fg)">${best.retailer} ${best.plan}</b> would save this home about <b style="color:#4ADE80">$${bestSave}/month (${bestPct}%)</b> on the same usage.</span></div>
    <div class="grid3" style="margin-bottom:16px">${sCard("Best",best,cur)}${sCard("Current",cur,cur)}${sCard("Worst",worst,cur)}</div>
    <div class="card"><div class="chd"><span class="t">Estimated monthly cost by plan</span><span class="sub" style="font-size:12px">Based on this home’s actual usage</span></div>
      <div class="cbd" style="display:flex;flex-direction:column;gap:14px">${bars}</div></div>`;
}

/* ============================ COACH ============================ */
function renderCoach(){
  const root=document.getElementById('coachRoot');
  document.querySelectorAll('.spot').forEach(e=>e.remove());
  if(S.coach>=STEPS.length){ root.innerHTML=""; return; }
  const st=STEPS[S.coach];
  root.innerHTML=`<div class="coach ${st.target?'':'hint'}">
    <div class="num">${S.coach+1}</div>
    <div class="body">
      <div class="step">Step ${GROUPS[S.coach]} of 7</div>
      <div class="msg">${st.msg}</div>
      <div class="actions">
        ${st.advanceOn==="next"?'<button class="btn" data-coach="next">Got it</button>':'<span class="sub" style="font-size:12.5px;color:var(--d400)">← follow the highlight</span>'}
        <span class="prog">Guided walkthrough</span>
      </div>
    </div>
  </div>`;
  if(st.target){ requestAnimationFrame(()=>spotlight(st.target)); }
}
function spotlight(sel){
  const el=document.querySelector(sel); if(!el) return;
  const r=el.getBoundingClientRect();
  const s=document.createElement('div'); s.className='spot';
  s.style.left=(r.left-6)+'px'; s.style.top=(r.top-6+window.scrollY)+'px';
  s.style.width=(r.width+12)+'px'; s.style.height=(r.height+12)+'px';
  document.getElementById('coachRoot').appendChild(s);
  el.classList.add('pointing');
}
function coachStepMatches(sel){ const st=STEPS[S.coach]; return !!st && st.advanceOn==="click" && st.target===sel; }
function coachDoAdvance(){ S.coach++; const nx=STEPS[S.coach]; if(nx){ if(nx.tab)S.tab=nx.tab; if(nx.propertyTab)S.propertyTab=nx.propertyTab; if(nx.panelTab)S.panelTab=nx.panelTab; if(nx.screen==="site"&&S.screen!=="site")S.screen="site"; } }
function coachNext(){ coachDoAdvance(); render(); }
function nav(action,sel){ if(action)action(); if(coachStepMatches(sel))coachDoAdvance(); render(); }

/* ============================ WIRING ============================ */
function wire(){
  app.querySelectorAll('[data-nav="sites"]').forEach(b=>b.onclick=()=>{S.screen="sites";render();});
  app.querySelectorAll('tr[data-site]').forEach(tr=>tr.onclick=()=>{ const id=tr.getAttribute('data-site'); if(id!==SITE.id)return; nav(()=>S.screen="site",'#row-'+id); });
  app.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.onclick=()=>{ const k=b.getAttribute('data-tab'); nav(()=>{S.tab=k;S.routineOpen=null;S.insTab="peak";},'#tab-'+k); });
  app.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{ const k=b.getAttribute('data-ptab'); nav(()=>S.propertyTab=k,'#subtab-'+k); });
  app.querySelectorAll('[data-ntab]').forEach(b=>b.onclick=()=>{ const k=b.getAttribute('data-ntab'); nav(()=>S.panelTab=k,'#subtab-'+k); });
  app.querySelectorAll('[data-fault]').forEach(el=>el.onclick=(e)=>{ if(e.target.closest('[data-wave]'))return; const id=el.getAttribute('data-fault'); nav(()=>{S.faultOpen[id]=!S.faultOpen[id];},'#fault-'+id); });
  app.querySelectorAll('[data-wave]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const id=b.getAttribute('data-wave'); nav(()=>{S.wave=id;},'[data-wave="'+id+'"]'); });
  app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ const id=b.getAttribute('data-view'); nav(()=>{S.routineOpen=id;},'[data-view="'+id+'"]'); });
  app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ S.routineOpen=null; render(); });
  const wm=document.getElementById('waveModal'); if(wm){ document.getElementById('waveClose').onclick=()=>{S.wave=null;render();}; wm.onclick=(e)=>{ if(e.target===wm){S.wave=null;render();} }; wireWave(); }
  app.querySelectorAll('[data-itab]').forEach(b=>b.onclick=()=>{ const k=b.getAttribute('data-itab'); nav(()=>{S.insTab=k;},'#itab-'+k); });
  document.getElementById('coachRoot').querySelectorAll('[data-coach="next"]').forEach(b=>b.onclick=()=>coachNext());
  wireSignal(); wireInsCharts();
  reportHeight();
}
function wireInsCharts(){
  const d=genInsights();
  Object.keys(INS_CFG).forEach(id=>{
    const wrap=document.getElementById(id); if(!wrap) return;
    const cfg=INS_CFG[id], series=d[cfg.key];
    const svg=wrap.querySelector('svg'), tip=wrap.querySelector('[data-tip]'), ch=wrap.querySelector('.ch'), mk=wrap.querySelector('.mk');
    const vh=svg.viewBox.baseVal.height;
    wrap.querySelectorAll('.pt').forEach(pt=>pt.addEventListener('mouseenter',()=>{
      const cx=+pt.getAttribute('cx'),cy=+pt.getAttribute('cy'),i=+pt.getAttribute('data-i');
      const r=svg.getBoundingClientRect(), px=cx/900*r.width, py=cy/vh*r.height;
      ch.setAttribute('x1',cx);ch.setAttribute('x2',cx);ch.style.opacity=.5;
      mk.setAttribute('cx',cx);mk.setAttribute('cy',cy);mk.style.opacity=1;
      const h=series[i].t, hh=String(Math.floor(h)).padStart(2,'0'), mm=(h%1)?'30':'00';
      tip.innerHTML=`<div class="tt">${hh}:${mm}</div><b>${cfg.fmt(series[i].v)}</b>`;
      tip.style.left=px+'px';tip.style.top=py+'px';tip.style.opacity=1;
    }));
    wrap.addEventListener('mouseleave',()=>{tip.style.opacity=0;ch.style.opacity=0;mk.style.opacity=0;});
  });
}
function wireWave(){
  const body=document.getElementById('waveBody'); if(!body) return;
  const f=FAULT_ALL.find(x=>x.id===S.wave); if(!f) return; const w=genWave(f.id);
  const charts=[...body.querySelectorAll('.wchart')];
  function update(frac){
    charts.forEach(ch=>{
      const idx=+ch.getAttribute('data-ch'), c=w.channels[idx];
      const padL=+ch.getAttribute('data-padl'), innerW=+ch.getAttribute('data-innerw'), win=+ch.getAttribute('data-window'), n=+ch.getAttribute('data-n');
      const cursor=ch.querySelector('.wcursor'), read=ch.querySelector('[data-read]');
      if(frac==null){ cursor.style.opacity=0; read.innerHTML='&nbsp;'; return; }
      const x=padL+frac*innerW; cursor.setAttribute('x1',x); cursor.setAttribute('x2',x); cursor.style.opacity=1;
      const i=Math.round(frac*(n-1)), v=c.samples[i], ms=frac*win;
      read.textContent=`${ms.toFixed(1)} ms · ${fmtVal(c,v)}`;
    });
  }
  charts.forEach(ch=>{ const svg=ch.querySelector('svg');
    svg.addEventListener('pointermove',(e)=>{ const r=svg.getBoundingClientRect(); if(!r.width)return; const Wv=+ch.getAttribute('data-w'), padL=+ch.getAttribute('data-padl'), innerW=+ch.getAttribute('data-innerw'); const viewX=(e.clientX-r.left)/r.width*Wv; update(Math.max(0,Math.min(1,(viewX-padL)/innerW))); });
  });
  body.addEventListener('pointerleave',()=>update(null));
}
function wireSignal(){
  const wrap=document.getElementById('sigwrap'); if(!wrap) return;
  const svg=wrap.querySelector('svg'), tip=document.getElementById('sigtip'), ch=document.getElementById('sigch'), mk=document.getElementById('sigmk');
  wrap.querySelectorAll('.pt').forEach(pt=>{
    pt.addEventListener('mouseenter',()=>{
      const cx=+pt.getAttribute('cx'), cy=+pt.getAttribute('cy');
      const dbm=Math.round(-40 - (cy-12)/(230-12-26)*40); // inverse of y()
      const rect=wrap.getBoundingClientRect(), sr=svg.getBoundingClientRect();
      const px=(cx/880)*sr.width, py=(cy/230)*sr.height;
      ch.setAttribute('x1',cx);ch.setAttribute('x2',cx);ch.style.opacity=.6;
      mk.setAttribute('cx',cx);mk.setAttribute('cy',cy);mk.style.opacity=1;
      const mins=Math.round((+pt.getAttribute('data-i'))/89*60);
      tip.innerHTML=`<div class="tt">${60-mins} min ago</div><b>${dbm} dBm</b> · <span style="color:var(--d500)">${dbm>=-60?'Good':dbm>=-70?'Fair':'Poor'}</span>`;
      tip.style.left=px+'px'; tip.style.top=py+'px'; tip.style.opacity=1;
    });
  });
  wrap.addEventListener('mouseleave',()=>{tip.style.opacity=0;ch.style.opacity=0;mk.style.opacity=0;});
}

/* iframe auto-height */
function reportHeight(){try{parent.postMessage({basisEmbed:'height',height:Math.ceil(document.documentElement.scrollHeight)},'*');}catch(e){}}
if(window.ResizeObserver){new ResizeObserver(reportHeight).observe(document.body);}
addEventListener('load',reportHeight);

render();
</script>
</body></html>
